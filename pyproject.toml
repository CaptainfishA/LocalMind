[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind-demo"
version = "0.7.0a3"
description = "Local-first AI file search and organization demo for Chinese Windows users."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "src/localmind/desktop/assets/icons/LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26,<2.4",
    "PySide6>=6.8,<6.12",
    "faiss-cpu>=1.14",
    "sentence-transformers[onnx]>=5.0",
    "jieba>=0.42.1",
    "watchdog>=6.0",
    "paddleocr>=3.5",
    "onnxruntime>=1.20",
    "safetensors>=0.8",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.26",
    "Pillow>=10",
]

[project.optional-dependencies]
benchmark = ["pyarrow>=18.0"]
dev = [
    "pytest>=8.0",
]

[project.scripts]
localmind = "localmind.ui:main"
localmind-index = "localmind.cli:main"
localmind-eval = "localmind.evaluation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localmind.desktop" = ["assets/icons/*.svg", "assets/icons/LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
