name: Windows CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check version and tag
        id: version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $appVersion = python -c "from runpy import run_path; print(run_path('src/localmind/__init__.py')['__version__'])"
          if ($version -cnotmatch '^\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?$' -or $version -cne $appVersion) {
            throw "Set the same X.Y.Z, X.Y.ZaN, X.Y.ZbN or X.Y.ZrcN version in pyproject.toml and localmind/__init__.py."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The release tag must be v$version."
          }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build Python distributions
        run: python -m build --outdir dist/release
      - name: Check distribution metadata
        run: python -m twine check --strict 'dist/release/*'
      - name: Install the wheel and test dependencies
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist/release -Filter *.whl
          if (@($wheel).Count -ne 1) { throw "Expected one built wheel." }
          python -m pip install "$($wheel.FullName)[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test the installed wheel
        run: python -m pytest -o pythonpath=
      - name: Build and smoke-test the Windows ZIP
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_windows.py dist/release
      - name: Store release assets
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localmind-release
          path: |
            dist/release/LocalMind-*-windows-x64.zip
            dist/release/*.tar.gz
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  draft:
    name: Draft GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: localmind-release
          path: release
      - name: Attach assets to the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_COMMIT: ${{ needs.windows.outputs.commit }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
          current_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
          if [[ "$current_commit" != "$BUILT_COMMIT" ]]; then
            echo "The tag no longer points to the commit that was built." >&2
            exit 1
          fi
          cd release
          sha256sum --check --strict SHA256SUMS.txt
          version="${tag#v}"
          assets=("LocalMind-${version}-windows-x64.zip" "localmind_demo-${version}.tar.gz" "SHA256SUMS.txt")
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]]
          done

          is_draft=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case "$is_draft" in
            false)
              echo "Release $tag is already published."
              exit 0
              ;;
            true) ;;
            '')
              flags=()
              if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]]; then
                flags+=(--prerelease)
              fi
              gh release create "$tag" --verify-tag --draft --title "LocalMind $tag" \
                --notes "Windows x64：完整解压 ZIP 后双击 LocalMind.exe。首次使用语义搜索或 OCR 时可能需要下载模型。" \
                --generate-notes "${flags[@]}"
              ;;
            *)
              echo "Unexpected release state for $tag." >&2
              exit 1
              ;;
          esac
          gh release upload "$tag" "${assets[@]}" --clobber
